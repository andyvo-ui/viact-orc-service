[pytest]
testpaths = tests
markers =
    offline: needs no gateway, no docker, no GPU, no paddleocr — runs on a laptop
    slow: takes tens of seconds or more (big images, multi-page PDFs, load)
    docker: shells out to `docker compose` — needs OCR_TEST_DOCKER=1
    doclane_down: only runs when the doc lane is NOT reachable
    accuracy: reports OCR quality; the verdict is a human call, not an assert
addopts = -ra --strict-markers
