# vLLM overrides for the doc lane. Keys are vLLM CLI flags with dashes.
#
# This file is the ONLY way to set these. paddlex's run_genai_server builds vLLM's
# argv from get_config() defaults merged with this YAML — it reads no environment
# variables, so the old GPU_MEMORY_UTILIZATION env var did nothing.
#
# Keys not listed here keep paddlex's defaults for PaddleOCR-VL
# (trust-remote-code, max-model-len 16384, max-num-batched-tokens 131072, ...).

# THE important one. paddlex's default is 0.5, i.e. ~16GB of a 32GB card — which
# collides with the Qwen 27B already holding 18-24GB on this GPU.
#
# Note this is a fraction of TOTAL VRAM, not of free VRAM: vLLM does not look at
# what Qwen already took. Raising it is how you starve the LLM.
#
# TEMPORARY, for /parse verification only (2026-07-31): 0.15 (~4.8GB) was the
# DECISIONS.md §7 budget target, but in practice vLLM raised "No available memory
# for the cache blocks" at that value — model weights (~2GB) + CUDA/framework
# overhead leave nothing for even one KV cache block, so it cannot start AT ALL
# below some real floor, regardless of what else is sharing the GPU. That check
# is not a flag you can turn off: without at least one cache block there is
# nowhere to put attention state, so vLLM cannot run at all, not "runs slower".
#
# 0.3 was then a guess with headroom to run while the GPU was otherwise idle —
# NOT measured against Qwen. With Qwen running (2026-08-03), the card reported
# only 6.63/31.36 GiB free, below what 0.3 (9.41 GiB of TOTAL) needs. Lowered to
# 0.2 (~6.27 GiB) to fit inside that headroom.
#
# 0.2 still crash-looped: torch.OutOfMemoryError trying to allocate 768 MiB with
# the process already at 6.57 GiB, card-wide free down to 669 MiB — ~15s after
# container start, before any request could have been sent. First guess was
# vLLM's CUDA graph capture step (runs after KV cache profiling, reserves extra
# transient VRAM outside the profiled budget) — added enforce-eager to skip it.
#
# Wrong guess: 0.18 + enforce-eager crash-looped with the IDENTICAL numbers
# (669 MiB free, 6.57 GiB in use, 768 MiB requested), and the confirmed log
# showed enforce_eager=True actually in effect — so graph capture was never
# the cause. Full traceback pinned it instead to gpu_model_runner.py _dummy_run
# -> the model's own forward pass (MLP act_fn -> torch.empty), i.e. vLLM's
# memory-profiling dummy batch, which vLLM sizes off max-num-batched-tokens —
# paddlex's default 131072 (see line 8), never touched by this file, sized for
# a whole dedicated card, not a ~6GB shared sliver. Lowered below to 4096; vLLM
# chunk-prefills sequences longer than that automatically, so max-model-len
# 16384 documents still work, just via more forward-pass steps (more latency
# per long doc, not a correctness issue).
#
# Card headroom next to Qwen (~19.7GB) + a third process (~5GB, unidentified,
# not a docker container) is thin regardless: steady-state free hovers as low
# as ~950MB with all three up. At 0.18 doc-lane itself settled at 6.44GB, ABOVE
# its own 5.73GB nominal budget — a chunk of its footprint (weights + CUDA
# context) is fixed, not scaled by this ratio.
#
# Retrying 0.15 now that max-num-batched-tokens is capped at 4096: the original
# "No available memory for the cache blocks" failure at 0.15 and the later raw
# OOM crash at 0.2/0.18 both trace to the SAME _dummy_run profiling step (see
# above) — its activation footprint was subtracted from the ratio's budget
# before the cache-block check, and separately had to fit in whatever was
# actually free on the card. A 131072-token dummy batch made both numbers
# large; a 4096-token one should shrink both. Not yet confirmed at 0.15 with
# this cap in place — if it reproduces "No available memory for the cache
# blocks" again, the floor is a fixed cost (weights + CUDA context) this ratio
# can't get under, and 0.18 is the value to fall back to.
gpu-memory-utilization: 0.15
enforce-eager: true
max-num-batched-tokens: 4096
