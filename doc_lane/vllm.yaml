# vLLM overrides for the doc lane. Keys are vLLM CLI flags with dashes.
#
# This file is the ONLY way to set these. paddlex's run_genai_server builds vLLM's
# argv from get_config() defaults merged with this YAML — it reads no environment
# variables, so the old GPU_MEMORY_UTILIZATION env var did nothing.
#
# Keys not listed here keep paddlex's defaults for PaddleOCR-VL
# (trust-remote-code, max-model-len 16384, max-num-batched-tokens 131072, ...).

# THE important one. paddlex's default is 0.5, i.e. ~16GB of a 32GB card — which
# collides with the Qwen 27B already holding 18-24GB on this GPU.
#
# Note this is a fraction of TOTAL VRAM, not of free VRAM: vLLM does not look at
# what Qwen already took. Raising it is how you starve the LLM.
#
# TEMPORARY, for /parse verification only (2026-07-31): 0.15 (~4.8GB) was the
# DECISIONS.md §7 budget target, but in practice vLLM raised "No available memory
# for the cache blocks" at that value — model weights (~2GB) + CUDA/framework
# overhead leave nothing for even one KV cache block, so it cannot start AT ALL
# below some real floor, regardless of what else is sharing the GPU. That check
# is not a flag you can turn off: without at least one cache block there is
# nowhere to put attention state, so vLLM cannot run at all, not "runs slower".
#
# 0.3 was then a guess with headroom to run while the GPU was otherwise idle —
# NOT measured against Qwen. With Qwen running (2026-08-03), the card reported
# only 6.63/31.36 GiB free, below what 0.3 (9.41 GiB of TOTAL) needs. Lowered to
# 0.2 (~6.27 GiB) to fit inside that headroom.
#
# 0.2 still crash-looped: torch.OutOfMemoryError trying to allocate 768 MiB with
# the process already at 6.57 GiB, card-wide free down to 669 MiB — and this hit
# ~15s after container start, before any request could have been sent. That
# timing points at vLLM's CUDA graph capture step, which runs right after KV
# cache profiling and reserves extra transient VRAM outside the profiled budget
# — gpu-memory-utilization never accounted for it. enforce-eager below skips
# that step entirely (costs some per-request latency, no capture-time spike).
#
# Card headroom next to Qwen (~19.7GB) + apparently a third process (~3.6GB,
# matches the STT budget in DECISIONS.md §7) is thin regardless: steady-state
# free hovers ~6.5GB. If this still OOMs, there is no more room in this value
# to give — re-check DECISIONS.md §7's assumed 20GB hard cap on Qwen, since the
# actual numbers observed here don't match it.
#
# Nudged 0.2 -> 0.18 (~5.64GB) for extra margin on top of enforce-eager. NOT
# confirmed to still clear the "No available memory for the cache blocks" floor
# that killed 0.15 (~4.8GB) — that check depends on the KV-cache budget this
# ratio produces, which shrinks as this goes down. If 0.18 hits that error
# instead of the CUDA-graph one, the floor sits between 0.18 and 0.2 and this
# needs to go back up, not down further.
gpu-memory-utilization: 0.18
enforce-eager: true
