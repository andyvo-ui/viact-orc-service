services:
  # Gateway + fast lane (PP-OCRv6_small, ONNX, CPU).
  #
  # The doc lane is NOT a service here: PaddleOCR-VL is served by an Ollama server
  # already running on the GPU host, outside this stack. gateway/.env supplies
  # DOC_LANE_URL and MODEL; that host must be reachable from inside the container,
  # which is why .env uses the LAN IP rather than localhost. /ocr stays up
  # regardless — /parse just returns 502 when the doc lane is unreachable.
  gateway:
    build: .
    image: ocr-service-gateway:latest
    container_name: ocr-gateway
    ports:
      - "8000:8000"
    env_file:
      - gateway/.env
    environment:
      - OCR_DEVICE=cpu
      - DOC_LANE_TIMEOUT=300
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
    restart: unless-stopped
